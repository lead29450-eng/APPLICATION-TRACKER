<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #172554;
}

header {
    background: #142b55;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

main {
    max-width: 500px;
    margin: 45px auto;
    padding: 25px;
    text-align: center;
}

.card {
    background: white;
    padding: 30px 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000012;
}

h2 {
    color: #142b55;
}

p {
    line-height: 1.6;
    color: #526078;
}

button {
    background: #142b55;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #718096;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>Application Tracker</h1>
    <p style="color:white;">
        Never Lose Track of Your Applications.
    </p>
</header>

<main>
    <div class="card">
        <h2>Welcome!</h2>

        <p>
            Keep all your job applications organised
            in one place.
        </p>

        <p>
            Track application dates, closing dates
            and application progress.
        </p>

        <button onclick="alert('Registration coming soon!')">
            Get Started
        </button>
    </div>
</main>

<footer>
    © 2026 Application Tracker
</footer>

</body>
</html>
