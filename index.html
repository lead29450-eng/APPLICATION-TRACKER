<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 24px 16px;
  color: #172b4d;
}

.container {
  max-width: 500px;
  margin: 40px auto;
  background: white;
  padding: 26px;
  border-radius: 14px;
  box-shadow: 0 3px 14px rgba(0,0,0,.10);
}

h1 { color: #173b68; }

input, select, textarea, button {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border-radius: 7px;
  font-size: 16px;
}

input, select, textarea {
  border: 1px solid #b8c2cc;
  background: white;
}

textarea { min-height: 100px; }

button {
  background: #173b68;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .6; }

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

#dashboard { display: none; }

#message {
  color: #a12622;
  overflow-wrap: anywhere;
}

.application-card {
  border: 1px solid #d5dce5;
  padding: 14px;
  margin: 12px 0;
  border-radius: 8px;
}

.application-card h4 {
  margin-top: 0;
  color: #173b68;
}

.description-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<main class="container">

<h1>Application Tracker</h1>

<section id="auth">

<h2>Welcome</h2>

<label for="email">Email address</label>
<input type="email" id="email" autocomplete="email"
placeholder="you@example.com">

<label for="password">Password</label>
<input type="password" id="password"
autocomplete="current-password"
placeholder="At least 6 characters">

<button id="signupButton" type="button" onclick="signUp()">
Create Account
</button>

<button id="loginButton" type="button" onclick="logIn()">
Log In
</button>

<p id="message" role="status" aria-live="polite"></p>

</section>

<section id="dashboard">

<h2>My Job Applications</h2>

<p>Keep track of all your job applications in one place.</p>

<h3>Add New Application</h3>

<form id="applicationForm" onsubmit="saveApplication(event)">

<label for="company_name">Company Name</label>
<input type="text" id="company_name" required>

<label for="job_title">Job Title</label>
<input type="text" id="job_title" required>

<label for="vacancy_reference">Vacancy Reference</label>
<input type="text" id="vacancy_reference">

<label for="circular_number">Circular Number</label>
<input type="text" id="circular_number"
placeholder="e.g. DPSA Vacancy Circular 45 of 2026">

<label for="job_description">Job Description</label>
<textarea id="job_description"
placeholder="Paste the full job advertisement, duties and requirements here..."></textarea>

<label for="date_applied">Date Applied</label>
<input type="date" id="date_applied">

<label for="closing_date">Closing Date</label>
<input type="date" id="closing_date">

<label for="status">Application Status</label>

<select id="status" required>
<option value="Applied">Applied</option>
<option value="Shortlisted">Shortlisted</option>
<option value="Interview">Interview</option>
<option value="Rejected">Rejected</option>
<option value="Offered">Offered</option>
</select>

<label for="notes">Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Application</button>

</form>

<p id="applicationMessage"></p>

<h3>My Saved Applications</h3>

<div id="applicationsList">No applications saved yet.</div>

<button type="button" onclick="logOut()">Log Out</button>

</section>

</main>
