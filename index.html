<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary:#2457d6;
  --dark:#172554;
  --light:#f4f7fc;
  --muted:#64748b;
  --border:#e2e8f0;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#1e293b}
button,input,select,textarea{font:inherit}
.topbar{background:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.brand{font-size:22px;font-weight:800;color:var(--dark)}
.brand span{color:var(--primary)}
.container{max-width:1150px;margin:35px auto;padding:0 20px}
.hero{background:linear-gradient(120deg,#173b83,#3977ed);color:white;padding:35px;border-radius:18px;margin-bottom:28px}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{margin:0;opacity:.9;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-bottom:28px}
.stat{background:white;padding:20px;border-radius:13px;border:1px solid var(--border)}
.stat small{color:var(--muted);display:block;margin-bottom:10px}
.stat strong{font-size:28px;color:var(--dark)}
.panel{background:white;padding:25px;border-radius:15px;margin-bottom:25px;border:1px solid var(--border)}
.panel h2{margin-top:0;color:var(--dark)}
label{display:block;font-weight:700;margin:15px 0 7px;font-size:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1e293b}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,87,214,.1)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.btn{border:none;padding:13px 18px;border-radius:8px;cursor:pointer;font-weight:700}
.btn:hover{opacity:.88}
.primary{background:var(--primary);color:white}
.secondary{background:#e8eefc;color:var(--primary)}
.danger{background:#fee2e2;color:#b91c1c}
.logout{background:#fff0f0;color:#b91c1c;padding:10px 15px}
.form-actions{display:flex;gap:10px;margin-top:20px}
#cancelEdit{display:none}
.search{margin-bottom:20px}
.application-card{border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:16px;background:white}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.application-card h3{margin:0 0 8px;color:var(--dark);font-size:19px}
.company{color:var(--muted);margin:0 0 15px}
.badge{padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700;display:inline-block}
.Applied{background:#dbeafe;color:#1d4ed8}
.Shortlisted{background:#ede9fe;color:#6d28d9}
.Interview{background:#fef3c7;color:#92400e}
.Rejected{background:#fee2e2;color:#b91c1c}
.Offered{background:#dcfce7;color:#15803d}
.awaiting-feedback{background:#e0f2fe;color:#0369a1}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.detail{background:#f8fafc;padding:11px;border-radius:8px;overflow-wrap:anywhere}
.detail small{color:var(--muted);display:block;margin-bottom:5px}
.description{background:#f8fafc;border-radius:8px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.countdown{font-weight:700;color:#15803d}
.countdown.closed{color:#b91c1c}
.countdown.today{color:#b45309}
.card-actions{display:flex;gap:10px;margin-top:16px}
.card-actions button{flex:1}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
#auth{max-width:430px;margin:70px auto}
#auth .panel{padding:30px}
#auth h1{color:var(--dark);text-align:center}
#message,#applicationMessage{overflow-wrap:anywhere;line-height:1.5}
#dashboard{display:none}

/* SMART REMINDERS */
.reminder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.reminder-card{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:16px}
.reminder-card h3{font-size:15px;margin:0 0 8px;color:var(--dark)}
.reminder-count{font-size:28px;font-weight:800;color:var(--primary)}
.reminder-list{font-size:13px;line-height:1.5;color:#475569;margin-top:8px;overflow-wrap:anywhere}
.reminder-list div{padding:7px 0;border-top:1px solid var(--border)}
.reminder-empty{color:var(--muted)}

@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr)}
.stat:last-child{grid-column:span 2}
.reminder-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:550px){
.container{margin:20px auto}
.hero{padding:25px}
.hero h1{font-size:24px}
.form-grid,.details,.reminder-grid{grid-template-columns:1fr}
.panel{padding:18px}
.topbar{padding:15px 18px}
.brand{font-size:19px}
.card-actions{flex-direction:column}
}
</style>
</head>
<body>

<header class="topbar">
<div class="brand">Application<span>Tracker</span></div>
<button id="logoutButton" class="btn logout"
